<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Buying Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:wght@400&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="mb" id="mb">
  <header>
    <div class="hrow">
      <div>
        <h1>Media Buying Desk</h1>
        <p class="sub" id="sub">Load your four exports to begin. Everything stays in this browser.</p>
      </div>
      <div class="chips" id="chips" aria-label="Loaded data"></div>
    </div>
    <p class="lede" id="lede"></p>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="data">Data</button>
    <button role="tab" data-tab="channels">Channels</button>
    <button role="tab" data-tab="profile">Channel profile</button>
    <button role="tab" data-tab="dayparts">Dayparts and prime time</button>
    <button role="tab" data-tab="industry">Industry</button>
    <button role="tab" data-tab="planner">Budget planner</button>
    <button role="tab" data-tab="programmes">Programmes</button>
    <button role="tab" data-tab="negotiate">Negotiation desk</button>
  </nav>
  <section id="detail" class="card detail" hidden></section>
  <div id="panel"></div>
  <div class="tip" id="tip" hidden></div>
</div>
<script src="/vendor/d3.min.js"></script>
<script src="/vendor/xlsx.full.min.js"></script>
<script src="/js/db.js"></script>
<script src="/js/ingest.js"></script>
<script src="/js/model.js"></script>
<script src="/js/core.js"></script>
<script src="/js/views-channels.js"></script>
<script src="/js/views-industry.js"></script>
<script src="/js/views-programmes.js"></script>
<script src="/js/views-negotiate.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
